# PostgreSQL + pgvector: the application's ONLY database (documents, chunks,
# embeddings, users, chats). There is no SQLite fallback.
#
#   docker compose up -d postgres
#
# The backend runs on the host and connects to 127.0.0.1:${POSTGRES_HOST_PORT}
# (see DATABASE_URL in backend/.env). A backend running inside this compose
# network would instead use host "postgres", port 5432.
#
# This server is shared with the sibling SAP_Projects stack: the same compose
# project name, container and volume, so this file reuses the existing
# sap_assistant_postgres container and its data instead of creating a second one.
# The application uses its own role and database (sap_brim_ai) inside it; the
# sap_assistant database belongs to SAP_Projects and is never touched.
#
# Never run `docker compose down -v`: it deletes the volume holding both databases.
name: sap_projects

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sap_assistant_postgres
    restart: unless-stopped
    environment:
      # Superuser credentials apply only when the volume is first initialised.
      POSTGRES_USER: ${POSTGRES_USER:-sap_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-sap_assistant}
      # Used by docker/postgres/init to create the sap_brim_ai role on a fresh volume.
      SAP_BRIM_DB_PASSWORD: ${SAP_BRIM_DB_PASSWORD:?Set SAP_BRIM_DB_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
