<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/src/assets/clyptusap-icon-small.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clyptus.AI — SAP + BRIM AI Knowledge Platform</title>
    <meta name="description" content="Clyptusap.ai is an enterprise AI knowledge assistant specialized strictly for SAP and SAP BRIM with private document grounding and authoritative citations." />
    <meta name="theme-color" content="#FAF7F2" />
    <script>
      (function() {
        try {
          const pref = localStorage.getItem('clyptus-appearance');
          if (pref === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preload" href="/fonts/dm-sans-normal-latin-3.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/manrope-normal-latin-22.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body class="bg-[#FAF7F2] text-stone-900 font-sans antialiased selection:bg-orange-500/25 selection:text-orange-900 transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
