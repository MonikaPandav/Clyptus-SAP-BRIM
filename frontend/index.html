<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/clyptusap-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clyptus.AI — SAP + BRIM AI Knowledge Platform</title>
    <meta name="description" content="Clyptusap.ai is an enterprise AI knowledge assistant specialized strictly for SAP and SAP BRIM with private document grounding and authoritative citations." />
    <meta name="theme-color" content="#FAF7F2" />
    <script>
      (function() {
        try {
          const pref = localStorage.getItem('clyptus-appearance');
          if (pref === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500;1,6..72,600;1,6..72,700&family=Playfair+Display:ital,wght@1,500;1,600;1,700&display=swap" rel="stylesheet">
  <body class="bg-[#FAF7F2] text-stone-900 font-sans antialiased selection:bg-orange-500/25 selection:text-orange-900 transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
